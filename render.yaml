# Miko deploy trigger 2026-09-21-1437
# Miko redeploy trigger 2026-09-21
services:
  - type: web
    name: miko-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APPSTATE_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MIKO_API_KEY
        sync: false
      - key: MIKO_API_TOKEN
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_MAX_TOKENS
        value: "5000"
